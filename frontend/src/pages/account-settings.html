<!-- ACCOUNT SETTINGS PAGE -->
<section class="account-hero" role="banner">
  <div class="container">
    <div class="flex flex-col md:flex-row items-center gap-6 text-center md:text-left">
      <div class="avatar avatar-sky user-avatar-letter" aria-hidden="true">U</div>
      <div class="avatar-info">
        <h1 class="avatar-name">Account Settings</h1>
        <div class="avatar-meta">
          <span class="avatar-name user-name" style="font-size: var(--font-body); font-weight: var(--fw-semibold);">Traveler</span>
          <span class="avatar-email user-email-display">traveler@layoverx.com</span>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="account-layout">

    <!-- Sidebar Navigation -->
    <aside class="account-sidebar sidebar-sticky" aria-label="Settings navigation">
      <nav class="account-sidebar-card">
        <h2 class="sr-only">Account Navigation</h2>
        <div class="account-sidebar-nav">
          <a href="my-profile.html" class="account-nav-link">
            <span class="nav-icon" aria-hidden="true">&#128100;</span>
            Profile Details
          </a>
          <a href="my-trips.html" class="account-nav-link">
            <span class="nav-icon" aria-hidden="true">&#9992;</span>
            My Trips
          </a>
          <a href="saved-itineraries.html" class="account-nav-link">
            <span class="nav-icon" aria-hidden="true">&#128190;</span>
            Saved Plans
          </a>
          <a href="account-settings.html" class="account-nav-link active" aria-current="page">
            <span class="nav-icon" aria-hidden="true">&#9881;</span>
            Settings
          </a>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <div class="account-content">

      <!-- Account Preferences Card -->
      <div class="account-card">
        <div class="account-card-header">
          <h2 class="account-card-title">
            <span class="card-icon" aria-hidden="true">&#9881;</span>
            Account Preferences
          </h2>
        </div>

        <form class="settings-form" onsubmit="event.preventDefault(); layoverx.showToast('Preferences updated successfully!', 'success')">

          <div class="settings-section">
            <div class="form-group">
              <label for="currency" class="form-label">Default Booking Currency</label>
              <select id="currency" class="form-input form-select cursor-pointer">
                <option value="INR" selected>INR (&#8377;) - Indian Rupee</option>
                <option value="USD">USD ($) - US Dollar</option>
                <option value="EUR">EUR (&euro;) - Euro</option>
                <option value="GBP">GBP (&pound;) - British Pound</option>
              </select>
            </div>
          </div>

          <div class="settings-section">
            <h3 class="settings-section-title">
              <span aria-hidden="true">&#128276;</span>
              Notification Preferences
            </h3>
            <div class="checkbox-list" role="group" aria-label="Flight notification options">
              <label class="checkbox-item">
                <input type="checkbox" checked aria-describedby="notif-whatsapp"/>
                <span class="checkbox-item-text" id="notif-whatsapp">Send WhatsApp status updates on my chauffeur details</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" checked aria-describedby="notif-sms"/>
                <span class="checkbox-item-text" id="notif-sms">SMS alerts on flight gate changes & delays during layover</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" aria-describedby="notif-email"/>
                <span class="checkbox-item-text" id="notif-email">Email notifications for exclusive supplier discount codes</span>
              </label>
            </div>
          </div>

          <hr style="border-color: var(--border-light);"/>

          <div class="settings-section">
            <h3 class="settings-section-title">
              <span aria-hidden="true">&#128274;</span>
              Password and Security
            </h3>
            <div class="form-row">
              <div class="form-group">
                <label for="new-password" class="form-label">New Password</label>
                <div class="password-field">
                  <input type="password" id="new-password" class="form-input" placeholder="Enter new password (min 6 characters)" minlength="6" aria-describedby="password-help"/>
                  <button type="button" class="password-toggle" onclick="togglePassword('new-password', this)" aria-label="Toggle password visibility">Show</button>
                </div>
                <span id="password-help" class="text-xs" style="color: var(--text-muted);">Must be at least 6 characters</span>
              </div>
              <div class="form-group">
                <label for="confirm-password" class="form-label">Confirm Password</label>
                <div class="password-field">
                  <input type="password" id="confirm-password" class="form-input" placeholder="Repeat password" minlength="6"/>
                  <button type="button" class="password-toggle" onclick="togglePassword('confirm-password', this)" aria-label="Toggle password visibility">Show</button>
                </div>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="reset" class="btn btn-ghost">Cancel</button>
            <button type="submit" class="btn btn-primary">Update Settings</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</section>

<script>
  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = 'Hide';
    } else {
      input.type = 'password';
      btn.textContent = 'Show';
    }
  }
</script>
