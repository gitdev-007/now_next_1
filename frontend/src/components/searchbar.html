<!--
  SEARCH BAR
  Styled input with search icon. Max-width 400px, consistent with form tokens.
  Usage:
    <div class="search-container">
      <svg class="search-icon">...</svg>
      <input class="search-input" placeholder="{{PLACEHOLDER}}"/>
    </div>
-->
<div class="search-container">
  <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" width="18" height="18">
    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
  </svg>
  <input class="search-input" type="text" placeholder="{{PLACEHOLDER}}" value="{{VALUE}}" aria-label="Search" autocomplete="off"/>
</div>
