<!--
  MODAL
  Overlay modal with backdrop blur. Radius: 24px (--radius-xl).
  Usage:
    <div class="modal-overlay" id="{{ID}}">
      <div class="modal-content">
        <button class="modal-close" onclick="closeModal('{{ID}}')">
          <svg>...</svg>
        </button>
        {{MODAL_BODY}}
      </div>
    </div>
-->
<div class="modal-overlay" id="{{MODAL_ID}}">
  <div class="modal-content">
    <!-- Close button -->
    <button class="modal-close" onclick="closeModal('{{MODAL_ID}}')" aria-label="Close modal">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" width="18" height="18">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <!-- Header -->
    {{#HAS_HEADER}}
    <div class="px-8 pt-8 pb-4 border-b border-[var(--border-light)]">
      <h2 class="text-xl font-bold text-[var(--text-primary)]">{{MODAL_TITLE}}</h2>
      {{#HAS_SUBTITLE}}<p class="text-sm text-[var(--text-muted)] mt-1">{{MODAL_SUBTITLE}}</p>{{/HAS_SUBTITLE}}
    </div>
    {{/HAS_HEADER}}

    <!-- Body -->
    <div class="p-8">
      {{MODAL_BODY}}
    </div>

    <!-- Footer -->
    {{#HAS_FOOTER}}
    <div class="px-8 pb-8 pt-4 border-t border-[var(--border-light)] flex items-center justify-end gap-3">
      {{MODAL_FOOTER}}
    </div>
    {{/HAS_FOOTER}}
  </div>
</div>

<script>
function openModal(id) {
  const el = document.getElementById(id);
  if (el) {
    el.style.display = 'flex';
    el.classList.add('flex');
    document.body.style.overflow = 'hidden';
  }
}
function closeModal(id) {
  const el = document.getElementById(id);
  if (el) {
    el.style.display = 'none';
    el.classList.remove('flex');
    document.body.style.overflow = '';
  }
}
// Close on backdrop click
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.style.display = 'none';
    e.target.classList.remove('flex');
    document.body.style.overflow = '';
  }
});
</script>
