        <h3 class="filters-title">{{TITLE}}</h3>
        <button class="action-btn">{{ACTION}}</button>
      </div>
      <div class="filters-grid">
        {{FILTER_OPTIONS}}
      </div>
    </div>

<div class="filters-container">
  <div class="filters-header">
    <h3 class="filters-title">{{TITLE}}</h3>
    <button class="action-btn">{{ACTION}}</button>
  </div>
  <div class="filters-grid">
    {{FILTER_CONTENT}}
  </div>
</div>
