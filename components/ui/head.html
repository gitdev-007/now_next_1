  <!-- Critical CSS: prevents FOUC & locks base font scale before Tailwind -->
  <style>
    @layer base {
      /* Lock root font size — prevents browser zoom shifts */
      html { font-size: 16px; box-sizing: border-box; }
      *, *::before, *::after { box-sizing: inherit; }

      /* Base body typography */
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* Heading scale — clear hierarchy, no browser defaults */
      .text-hero { font-size: 3.5rem; line-height: 1.5; font-weight: 900; letter-spacing: -0.03em; }
      h1 { font-size: 2.5rem; line-height: 1.5; font-weight: 800; letter-spacing: -0.025em; }
      h2 { font-size: 1.875rem; line-height: 1.5; font-weight: 800; letter-spacing: -0.02em; }
      h3 { font-size: 1.375rem; line-height: 1.5; font-weight: 700; letter-spacing: -0.015em; }
      h4 { font-size: 1.125rem; line-height: 1.5; font-weight: 700; }
      h5 { font-size: 1rem; line-height: 1.5; font-weight: 600; }
      h6 { font-size: 0.9375rem; line-height: 1.5; font-weight: 600; }

      /* Body text — never smaller than 14px */
      p { font-size: 1rem; line-height: 1.5; }

      /* Input & button baseline */
      input, select, textarea, button { font-family: inherit; font-size: 0.95rem; }

      /* Prevent layout shift from Tailwind loading */
      .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 1rem; }

      /* Hide body content until CSS is parsed — avoids naked HTML flash */
      body { visibility: visible; }
    }
  </style>

  <!-- Firebase & Supabase compatibility shim for legacy page templates -->
  <script>
    // Setup Firebase compat shims for legacy page templates
    window.firebase = window.firebase || {
      firestore: {
        FieldValue: {
          serverTimestamp: () => new Date().toISOString()
        }
      }
    };

    (function() {
      if (window.layoverxAuth && window.layoverxDb) return; // Don't override if already set (e.g. by tests)

      const getStoredUser = () => {
        try {
          const userStr = sessionStorage.getItem('__mockUser') || localStorage.getItem('layoverx_user');
          return userStr ? JSON.parse(userStr) : null;
        } catch(e) {
          return null;
        }
      };

      const setStoredUser = (user) => {
        try {
          if (user) {
            sessionStorage.setItem('__mockUser', JSON.stringify(user));
            localStorage.setItem('layoverx_user', JSON.stringify(user));
          } else {
            sessionStorage.removeItem('__mockUser');
            localStorage.removeItem('layoverx_user');
          }
        } catch(e) {}
      };

      let currentUser = getStoredUser();
      const authCallbacks = [];

      const mockAuth = {
        onAuthStateChanged: function(cb) {
          if (window.supabase && window.supabase.auth) {
            const { data } = window.supabase.auth.onAuthStateChange((event, session) => {
              const user = session ? session.user : null;
              if (user) {
                user.uid = user.id;
                user.displayName = user.user_metadata?.full_name || user.email.split('@')[0];
              }
              cb(user);
            });
            return () => {
              if (data && data.subscription) {
                data.subscription.unsubscribe();
              }
            };
          }
          authCallbacks.push(cb);
          // Execute callback with current state immediately
          setTimeout(() => cb(currentUser), 10);
          return () => {
            const index = authCallbacks.indexOf(cb);
            if (index > -1) authCallbacks.splice(index, 1);
          };
        },
        get currentUser() {
          if (window.supabase && window.supabase.auth) {
            try {
              const saved = localStorage.getItem('layoverx_user');
              if (saved) {
                const u = JSON.parse(saved);
                u.uid = u.id;
                u.displayName = u.user_metadata?.full_name || u.email.split('@')[0];
                return u;
              }
            } catch(e) {}
          }
          return currentUser;
        },
        createUserWithEmailAndPassword: async function(email, password) {
          if (window.supabase && window.supabase.auth) {
            const { data, error } = await window.supabase.auth.signUp({ email, password });
            if (error) throw error;
            const u = data.user;
            u.uid = u.id;
            u.displayName = u.user_metadata?.full_name || u.email.split('@')[0];
            return { user: u };
          }
          currentUser = {
            uid: 'usr_' + Math.random().toString(36).substring(2, 11),
            email: email,
            displayName: email.split('@')[0],
            updateProfile: async function(profile) {
              currentUser.displayName = profile.displayName;
              setStoredUser(currentUser);
              authCallbacks.forEach(cb => cb(currentUser));
            }
          };
          setStoredUser(currentUser);
          authCallbacks.forEach(cb => cb(currentUser));
          return { user: currentUser };
        },
        signInWithEmailAndPassword: async function(email, password) {
          if (window.supabase && window.supabase.auth) {
            const { data, error } = await window.supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            const u = data.user;
            u.uid = u.id;
            u.displayName = u.user_metadata?.full_name || u.email.split('@')[0];
            return { user: u };
          }
          currentUser = {
            uid: 'usr_' + Math.random().toString(36).substring(2, 11),
            email: email,
            displayName: email.split('@')[0],
            updateProfile: async function(profile) {
              currentUser.displayName = profile.displayName;
              setStoredUser(currentUser);
              authCallbacks.forEach(cb => cb(currentUser));
            }
          };
          setStoredUser(currentUser);
          authCallbacks.forEach(cb => cb(currentUser));
          return { user: currentUser };
        },
        signOut: async function() {
          if (window.supabase && window.supabase.auth) {
            const { error } = await window.supabase.auth.signOut();
            if (error) throw error;
            return;
          }
          currentUser = null;
          setStoredUser(null);
          authCallbacks.forEach(cb => cb(null));
        }
      };

      // Simple document database store backed by localStorage
      const getDbStore = () => {
        try {
          return JSON.parse(localStorage.getItem('__mockDbStore')) || {};
        } catch(e) {
          return {};
        }
      };

      const setDbStore = (store) => {
        try {
          localStorage.setItem('__mockDbStore', JSON.stringify(store));
        } catch(e) {}
      };

      const mockDb = {
        collection: function(colName) {
          return {
            doc: function(docId) {
              return {
                set: async function(data, options) {
                  const store = getDbStore();
                  if (!store[colName]) store[colName] = {};
                  store[colName][docId] = { ...store[colName][docId], ...data };
                  setDbStore(store);
                },
                get: async function() {
                  const store = getDbStore();
                  const data = store[colName] ? store[colName][docId] : null;
                  return {
                    exists: !!data,
                    data: () => data
                  };
                }
              };
            },
            where: function(field, op, val) {
              return {
                get: async function() {
                  const store = getDbStore();
                  const results = [];
                  Object.values(store[colName] || {}).forEach(doc => {
                    if (doc[field] === val) {
                      results.push({
                        id: doc.id || doc.applicationId || doc.uid,
                        data: () => doc
                      });
                    }
                  });
                  return {
                    forEach: (cb) => results.forEach(cb),
                    empty: results.length === 0,
                    size: results.length,
                    docs: results
                  };
                }
              };
            }
          };
        }
      };

      const mockStorage = {
        ref: function() {
          return {
            child: function(path) {
              return {
                put: async function(file) {
                  return {};
                },
                getDownloadURL: async function() {
                  return `https://firebasestorage.googleapis.com/v0/b/mock/o/${encodeURIComponent(path)}`;
                }
              };
            }
          };
        }
      };

      // Define globals if not already defined (e.g. by Playwright init script overrides)
      if (!window.layoverxAuth) window.layoverxAuth = mockAuth;
      if (!window.layoverxDb) window.layoverxDb = mockDb;
      if (!window.layoverxStorage) window.layoverxStorage = mockStorage;

      if (!window.supabase) {
        window.supabase = (function() {
          const authCallbacks = [];
          let currentUser = null;
          try {
            const saved = localStorage.getItem('layoverx_user');
            if (saved) currentUser = JSON.parse(saved);
          } catch(e) {}

          const mockSession = () => {
            if (!currentUser) return null;
            return {
              user: currentUser,
              access_token: 'mock-access-token',
              expires_in: 3600
            };
          };

          const notifyListeners = (event = 'SIGNED_IN') => {
            authCallbacks.forEach(cb => cb(event, mockSession()));
          };

          return {
            auth: {
              onAuthStateChange: function(cb) {
                authCallbacks.push(cb);
                setTimeout(() => cb(currentUser ? 'SIGNED_IN' : 'SIGNED_OUT', mockSession()), 10);
                return {
                  data: {
                    subscription: {
                      unsubscribe: () => {
                        const index = authCallbacks.indexOf(cb);
                        if (index > -1) authCallbacks.splice(index, 1);
                      }
                    }
                  }
                };
              },
              getSession: async function() {
                return { data: { session: mockSession() }, error: null };
              },
              signUp: async function({ email, password, options }) {
                const fullName = options?.data?.full_name || email.split('@')[0];
                currentUser = {
                  id: 'usr_' + Math.random().toString(36).substring(2, 11),
                  email,
                  user_metadata: { full_name: fullName }
                };
                try {
                  localStorage.setItem('layoverx_user', JSON.stringify(currentUser));
                } catch(e) {}
                setTimeout(() => notifyListeners('SIGNED_IN'), 10);
                return { data: { user: currentUser }, error: null };
              },
              signInWithPassword: async function({ email, password }) {
                currentUser = {
                  id: 'usr_' + Math.random().toString(36).substring(2, 11),
                  email,
                  user_metadata: { full_name: email.split('@')[0] }
                };
                try {
                  localStorage.setItem('layoverx_user', JSON.stringify(currentUser));
                } catch(e) {}
                setTimeout(() => notifyListeners('SIGNED_IN'), 10);
                return { data: { session: mockSession(), user: currentUser }, error: null };
              },
              signOut: async function() {
                currentUser = null;
                try {
                  localStorage.removeItem('layoverx_user');
                } catch(e) {}
                setTimeout(() => notifyListeners('SIGNED_OUT'), 10);
                return { error: null };
              },
              signInWithOAuth: async function(options) {
                currentUser = {
                  id: 'usr_google_mock',
                  email: 'google_user@gmail.com',
                  user_metadata: { full_name: 'Mock Google User' }
                };
                try {
                  localStorage.setItem('layoverx_user', JSON.stringify(currentUser));
                } catch(e) {}
                setTimeout(() => notifyListeners('SIGNED_IN'), 10);
                return { data: { provider: 'google', url: '#' }, error: null };
              }
            },
            from: function(tableName) {
              return {
                upsert: async function(payload) {
                  try {
                    const store = JSON.parse(localStorage.getItem('__mockDbStore')) || {};
                    if (!store[tableName]) store[tableName] = {};
                    const key = payload.uid || payload.id || 'doc_' + Math.random().toString(36).substring(2, 11);
                    store[tableName][key] = { ...store[tableName][key], ...payload };
                    localStorage.setItem('__mockDbStore', JSON.stringify(store));
                  } catch(e) {}
                  return { error: null };
                },
                insert: async function(payloads) {
                  try {
                    const store = JSON.parse(localStorage.getItem('__mockDbStore')) || {};
                    if (!store[tableName]) store[tableName] = [];
                    if (Array.isArray(store[tableName])) {
                      store[tableName].push(...payloads);
                    } else {
                      store[tableName] = payloads;
                    }
                    localStorage.setItem('__mockDbStore', JSON.stringify(store));
                  } catch(e) {}
                  return { error: null };
                },
                select: function() {
                  return {
                    eq: function() {
                      return {
                        maybeSingle: async function() {
                          return { data: null, error: null };
                        },
                        execute: async function() {
                          return { data: [], error: null };
                        }
                      };
                    }
                  };
                }
              };
            }
          };
        })();
      }
    })();
  </script>
